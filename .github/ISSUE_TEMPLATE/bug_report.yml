name: 🐛 Bug Report
description: Report a calculation inconsistency or UI glitch
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue with the AIUB GPA Calculator.
  - type: input
    id: course-info
    attributes:
      label: Course / Semester Affected
      description: What course or semester was being calculated when the issue occurred?
      placeholder: e.g., CSC4160 or Semester 8
    validations:
      required: true
  - type: textarea
    id: expected-vs-actual
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what happened instead?
      placeholder: Expected Term GPA of 3.80, but saw 3.75...
    validations:
      required: true
