name: AIUB GPA Calculator CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    name: Run Python Tests & Validate Web Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run GPA & Retake Mathematical Test Suite
        run: |
          python tests/test_gpa.py -v

      - name: Validate Web Files Existence & Integrity
        run: |
          test -f index.html || exit 1
          test -f style.css || exit 1
          test -f script.js || exit 1
          test -f README.md || exit 1
          echo "All critical web assets and documentation verified successfully."
